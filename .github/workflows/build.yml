name: Build macOS + Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3 + AU + Standalone
        run: cmake --build build --config Release --parallel 4 --target ACE_VST3 ACE_AU ACE_Standalone

      - name: Ad-hoc sign
        run: |
          ART=build/ACE_artefacts/Release
          ls -R "$ART" | head -50
          codesign --force --deep --sign - "$ART/VST3/ACE.vst3"
          codesign --force --deep --sign - "$ART/AU/ACE.component"
          codesign --force --deep --sign - "$ART/Standalone/ACE.app"
          lipo -info "$ART/VST3/ACE.vst3/Contents/MacOS/ACE"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --output-dir pluginval-logs "build/ACE_artefacts/Release/VST3/ACE.vst3"

      - name: GUI check (editor opens + screenshot)
        continue-on-error: true
        run: |
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 3 --validate-in-process \
            --output-dir pluginval-gui-logs "build/ACE_artefacts/Release/VST3/ACE.vst3" || echo "GUI validation failed"
          open build/ACE_artefacts/Release/Standalone/ACE.app
          sleep 12
          screencapture -x ui-check.png || true
          osascript -e 'tell application "ACE" to quit' || true
          if [ -f ui-check.png ]; then
            mkdir -p /tmp/shot && cp ui-check.png /tmp/shot/
            cd /tmp/shot && git init -q && git checkout -q -b ci-shots
            git -c user.name=ci -c user.email=ci@local add ui-check.png
            git -c user.name=ci -c user.email=ci@local commit -qm "UI screenshot ${{ github.sha }}"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: ui-check.png
          if-no-files-found: ignore

      - name: Package
        run: |
          ART=build/ACE_artefacts/Release
          mkdir -p dist/ACE-mac
          cp -R "$ART/VST3/ACE.vst3" "$ART/AU/ACE.component" "$ART/Standalone/ACE.app" dist/ACE-mac/
          cp INSTALL-MAC.txt dist/ACE-mac/
          cd dist && ditto -c -k --sequesterRsrc --keepParent ACE-mac ACE-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ACE-mac
          path: dist/ACE-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          $v = "1.0.1901.177"
          New-Item -ItemType Directory -Force -Path nuget | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath "nuget/Microsoft.Web.WebView2.$v"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/nuget"

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --parallel --target ACE_VST3 ACE_Standalone

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          $vst = "build/ACE_artefacts/Release/VST3/ACE.vst3"
          $p = Start-Process -FilePath "pv/pluginval.exe" -ArgumentList "--strictness-level 5 --skip-gui-tests --validate-in-process --output-dir pv-logs `"$vst`"" -Wait -PassThru -NoNewWindow
          Get-ChildItem pv-logs -Recurse -File | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 15 }
          if ($p.ExitCode -ne 0) { Write-Error "pluginval failed ($($p.ExitCode))"; exit 1 }

      - name: GUI check (editor opens in WebView2)
        shell: pwsh
        continue-on-error: true
        run: |
          $vst = "build/ACE_artefacts/Release/VST3/ACE.vst3"
          $p = Start-Process -FilePath "pv/pluginval.exe" -ArgumentList "--strictness-level 3 --validate-in-process --output-dir pv-gui-logs `"$vst`"" -Wait -PassThru -NoNewWindow
          Get-ChildItem pv-gui-logs -Recurse -File | ForEach-Object { Get-Content $_.FullName | Select-String -Pattern "Editor|SUCCESS|FAIL" }
          "GUI pluginval exit code: $($p.ExitCode)"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ACE-windows | Out-Null
          Copy-Item -Recurse build/ACE_artefacts/Release/VST3/ACE.vst3 dist/ACE-windows/
          Copy-Item build/ACE_artefacts/Release/Standalone/ACE.exe dist/ACE-windows/
          Copy-Item INSTALL-WINDOWS.txt dist/ACE-windows/
          Compress-Archive -Path dist/ACE-windows -DestinationPath dist/ACE-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ACE-windows
          path: dist/ACE-windows.zip

  release:
    needs: [ mac, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dl/ACE-mac/ACE-mac.zip dl/ACE-windows/ACE-windows.zip \
            --title "ACE — latest build (macOS + Windows)" \
            --notes "macOS: universal (Apple Silicon + Intel) VST3, AU, Standalone. Windows: 64-bit VST3 + Standalone. Install steps are inside each zip." \
            --target "${{ github.sha }}"
